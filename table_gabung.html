<!DOCTYPE html>
<html>
    <head>
        <title>Colspan dan Rowspan</title>
        <link rel="stylesheet" href="table_gabung.css">
    </head>
    <body>
        <h2>Colspan dan Rowspan pada Table</h2>
        <!-- colspan : menggabungkan kolom 
             rowspan : menggabungkan baris -->
        <table>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <th> Ulangan 1</th>
                <th> Ulangan 2</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Glori</td>
                <td>90</td>
                <td>93</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Mia</td>
                <td>97</td>
                <td>90</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Callista</td>
                <td>100</td>
                <td>100</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Beatrice</td>
                <td>100</td>
                <td>100</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Agnes</td>
                <td>97</td>
                <td>91</td>
            </tr>
        </table>
    </body>
</html>
